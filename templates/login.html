{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
  <div class="card-title">Welcome back 👋</div>
  <div class="card-sub">Sign in to your account securely</div>

  <form method="POST" action="{{ url_for('login') }}" autocomplete="off" novalidate>
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" type="text" id="username" name="username"
             value="{{ username|default('') }}" placeholder="Enter your username"
             autocomplete="username" required maxlength="32" spellcheck="false"/>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrapper">
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Enter your password"
               autocomplete="current-password" required maxlength="128"
               style="padding-right: 44px;"/>
        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">🔐 Sign In</button>
  </form>

  <div class="divider">or</div>
  <p class="text-center text-muted">
    Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
  </p>

  <div class="security-badges">
    <div class="badge">🔑 <span>bcrypt</span> hashed</div>
    <div class="badge">🛡️ <span>SQL Injection</span> safe</div>
    <div class="badge">🔒 <span>Rate</span> limited</div>
    <div class="badge">🚫 <span>Lockout</span> after 5 fails</div>
  </div>
</div>

<script>
function togglePw(inputId, btn) {
  const el = document.getElementById(inputId);
  const shown = el.type === 'text';
  el.type = shown ? 'password' : 'text';
  btn.textContent = shown ? '👁️' : '🙈';
}
</script>
{% endblock %}
